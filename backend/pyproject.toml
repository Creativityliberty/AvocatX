[tool.poetry]
name = "defenseur-ia-backend"
version = "2024.12.01"
description = "Backend FastAPI pour DEFENSEUR-IA - Système d'IA juridique"
authors = ["AvocatX Team <team@avocatx.fr>"]
readme = "README.md"
packages = [{include = "defenseur_ia", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.2.1"
python-multipart = "^0.0.6"
aiofiles = "^23.2.1"
httpx = "^0.26.0"
openai = "^1.12.0"
faiss-cpu = "^1.8.0"
tesseract = "^0.1.3"
pinecone = {extras = ["grpc", "asyncio"], version = "^7.0.0"}
langchain = "^0.1.0"
langchain-openai = "^0.0.5"
transformers = "^4.36.0"
python-docx = "^1.1.0"
reportlab = "^4.0.7"
pdf2image = "^1.17.0"
pypdf2 = "^3.0.1"
python-magic = "^0.4.27"
email-validator = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
redis = "^5.0.1"
alembic = "^1.13.0"
sqlalchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
websockets = "^12.0"
python-socketio = "^5.10.0"
serpapi = "^0.1.0"
beautifulsoup4 = "^4.12.2"
requests = "^2.31.0"
Pillow = "^10.1.0"
opencv-python = "^4.8.1"
pdfplumber = "^0.10.0"
spacy = "^3.7.2"
nltk = "^3.8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.2"
pytest-cov = "^4.1.0"
black = "^23.12.0"
isort = "^5.13.2"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"
